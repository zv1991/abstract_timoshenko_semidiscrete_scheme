name: timoshenko-solver-env  # Customize the environment name
channels:
  - conda-forge
  - defaults

dependencies:
  # === Core numerical libraries ===
  - numpy>=1.21              # Arrays, linear algebra, quadrature roots
  - scipy>=1.7               # Special functions (Legendre), sparse matrices

  # === Automatic numerical differentiation ===
  - numdifftools>=0.9        # Adaptive finite difference derivatives (first-order)

  # === (Optional) Dev and plotting tools ===
  - tqdm                     # Progress bar (optional)
  - matplotlib               # Plotting utilities (optional)

  # === (Optional) Serialization and Symbolic Tools ===
  - joblib                   # Efficient saving/loading of Python objects
  - sympy                    # Symbolic algebra and calculus
  - mpmath                   # High-precision arithmetic (used alongside sympy)

  # === (Optional) Utilities for file handling and timing ===
  # These are part of Python's standard library:
  # - os
  # - time
  # - pathlib
  # - datetime
  # - importlib
  # - warnings